services:
  fitmaxxing:
    build: .
    container_name: fitmaxxing
    ports:
      - "3000:3000"
    volumes:
      - fitmaxxing-data:/app/data
    networks:
      - default
      - nginx_default
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/fitmaxxing.db

volumes:
  fitmaxxing-data:

networks:
  default:
  nginx_default:
    external: true
